services:
  - type: web
    name: hospital-forecast-api
    env: python
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
    healthCheckPath: /health
    plan: free

