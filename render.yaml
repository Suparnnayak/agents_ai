services:
  - type: web
    name: hospital-forecast-api
    env: python
    rootDir: agents_ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
    healthCheckPath: /health
    plan: free  # or 'starter' for paid tier

