name: Weekly Model Retrain

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday at 3:00 AM UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: read

jobs:
  weekly-retrain:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-retrain-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-retrain-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify imports
        run: |
          python -c "from scripts.weekly_retrain import main; print('Import OK')"

      - name: Run weekly retrain
        run: python -m scripts.weekly_retrain

