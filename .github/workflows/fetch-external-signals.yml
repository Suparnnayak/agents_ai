name: Fetch External Signals

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2:00 AM UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: read

jobs:
  fetch-signals:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-signals-${{ hashFiles('requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-signals-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install -e .

      - name: Verify imports
        run: |
          python -c "from app.services.external_data_service import fetch_and_store_external_signals; print('Import OK')"

      - name: Fetch and store external signals
        run: python -m scripts.fetch_external_signals
