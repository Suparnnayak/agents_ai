name: Monthly Model Retraining

on:
  schedule:
    - cron: "0 0 1 * *"   # Runs 1st of every month at 00:00 UTC
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: agents_ai
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug file structure
        working-directory: agents_ai
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Root contents ==="
          ls -la
          echo ""
          echo "=== Looking for train_forecast_system.py ==="
          find . -name "train_forecast_system.py" -type f
          echo ""
          echo "=== Looking for forecast_system directory ==="
          find . -type d -name "forecast_system" | head -10
          echo ""
          echo "=== forecast_system contents (if exists) ==="
          ls -la forecast_system/ 2>&1 || echo "forecast_system NOT FOUND in current directory"
          echo ""
          echo "=== Python sys.path ==="
          python -c "import sys; [print(p) for p in sys.path]"
          echo ""
          echo "=== Testing import ==="
          python -c "import sys; from pathlib import Path; ROOT = Path('.').resolve(); print(f'ROOT: {ROOT}'); sys.path.insert(0, str(ROOT)); import forecast_system" 2>&1 || echo "Import failed"

      - name: Run training pipeline
        working-directory: agents_ai
        run: |
          export PYTHONPATH=$(pwd)
          python train_forecast_system.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add agents_ai/models/forecast_system/lightgbm_final.pkl
          if ! git diff --staged --quiet; then
            git commit -m "Auto retrain model [skip ci]"
            git push
          else
            echo "No model changes to commit"
          fi
