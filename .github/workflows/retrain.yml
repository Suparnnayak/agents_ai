name: Monthly Model Retraining

on:
  schedule:
    - cron: "0 0 1 * *"   # Runs 1st of every month at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Debug directory structure
        run: |
          echo "Current working directory:"
          pwd
          echo "Directory tree:"
          ls -R

      - name: Run training pipeline
        run: |
          export PYTHONPATH="$PWD"
          python train_forecast_system.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models/forecast_system/lightgbm_final.pkl
          if ! git diff --staged --quiet; then
            git commit -m "Auto retrain model [skip ci]"
            git push
          else
            echo "No model changes to commit"
          fi
