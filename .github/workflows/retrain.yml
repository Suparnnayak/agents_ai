name: Monthly Model Retraining

on:
  schedule:
    - cron: "0 0 1 * *"   # Runs 1st of every month at 00:00 UTC
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: agents_ai
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .  # Install package in editable mode

      - name: Run training pipeline
        working-directory: agents_ai
        run: |
          # Set PYTHONPATH to ensure Python can find forecast_system package
          # This handles nested directory structures in GitHub Actions
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          echo "Current directory: $(pwd)"
          echo "PYTHONPATH: $PYTHONPATH"
          echo "Python path check:"
          python -c "import sys; print('\\n'.join(sys.path))"
          python train_forecast_system.py

      - name: Commit updated model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add agents_ai/models/forecast_system/lightgbm_final.pkl
          if ! git diff --staged --quiet; then
            git commit -m "Auto retrain model [skip ci]"
            git push
          else
            echo "No model changes to commit"
          fi
