name: Daily Forecast Job

on:
  schedule:
    - cron: "30 2 * * *"  # Daily at 2:30 AM UTC (after signals)
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: read

jobs:
  daily-forecast:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-forecast-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-forecast-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify imports
        run: |
          python -c "from scripts.daily_forecast_job import main; print('Import OK')"

      - name: Run daily forecast job
        run: python -m scripts.daily_forecast_job

